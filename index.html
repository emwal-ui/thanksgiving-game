html,body{margin:0}
body{

main{max-width:680px;margin:0 auto;padding:22px 16px 80px}
main.large{max-width:1240px}
h1{font-size:2rem;margin:0 0 6px;line-height:1.1;text-wrap:balance}
h2{margin:0 0 8px;font-size:1.35rem}
p{line-height:1.45}
a{color:var(--dinde-fonce)}
.sous{color:var(--doux);margin:0 0 16px}
.centre{text-align:center}

label{font-weight:600}
input{font:inherit;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--ligne);font-size:1.15rem;background:#fffdf9;outline:none;margin-top:8px}
input:focus{border-color:var(--dinde)}

button.Dinde{background:var(--dinde)} button.Patate{background:var(--patate)}
button.fantome{background:#fff;color:var(--encre);border:2px solid var(--ligne);box-shadow:none}
button.danger{background:#fff;color:#b3261e;border:2px solid #f0c4c0;box-shadow:none}

async function rpc(nom, args = {}){
  let r;
  try{
    r = await fetch(CONFIG.SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/rpc/" + nom, {
      method: "POST",
      headers: { "apikey": CONFIG.SUPABASE_CLE, "Content-Type": "application/json" },
      body: JSON.stringify(args)

  const txt = await r.text();
  let data = null;
  try{ data = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!r.ok) throw new Error((data && data.message) || ("Erreur du serveur (" + r.status + ")."));

/* ---------- Confettis ---------- */
function confettis(cols = ["#d9572b", "#b8862f", "#3f9150", "#f2c14e", "#7d4e2d"], n = 150){
  const c = $("#confetti"), ctx = c.getContext("2d"), d = window.devicePixelRatio || 1;
  const W = c.width = innerWidth * d, H = c.height = innerHeight * d;
  const parts = Array.from({length: n}, () => ({
    x: W / 2 + (Math.random() - .5) * W * .35, y: H * .4,
    vx: (Math.random() - .5) * 20 * d, vy: (-Math.random() * 17 - 6) * d,
    r: (5 + Math.random() * 7) * d, a: Math.random() * 6, va: (Math.random() - .5) * .3,
    col: hasard(cols)
  }));
  const t0 = performance.now();
  (function frame(t){
    ctx.clearRect(0, 0, W, H);
    parts.forEach(p => {
      p.vy += .45 * d; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
      ctx.fillStyle = p.col; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore();
    });
    if(t - t0 < 3400) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
  })(t0);
}

}

   GÉNÉRATION DES CARTES (dans le navigateur de l'organisatrice)
   ===================================================================== */
// GENERATION-DEBUT
function melanger(a){
  const b = a.slice();
  for(let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
  return b;
}
function remplir(modele, nom){
  const voyelle = /^[AEIOUYÉÈÊÂaeiouyéèêâ]/.test(nom);
  return modele.replace("de [X]", voyelle ? "d’" + nom : "de " + nom).replace("[X]", nom);
}
function tenterPartie(joueurs){
  const ordre = melanger(joueurs);
  const moitie = Math.ceil(ordre.length / 2);
  const equipeDe = {};
  ordre.forEach((j, i) => { equipeDe[j.cle] = i < moitie ? "Dinde" : "Patate"; });
  const membres = eq => ordre.filter(j => equipeDe[j.cle] === eq);
  const espions = {};
  EQUIPES.forEach(eq => { const m = membres(eq); if(m.length >= 2) espions[eq] = m[Math.floor(Math.random() * m.length)].cle; });

  const paires = new Set(), solos = new Set(), missionsEquipe = {};
  const modelesEquipe = new Set();   // formules réservées aux missions d'équipe
  const soloLibre = () => {
    const libres = SOLOS.map((_, i) => i).filter(i => !solos.has(i));
    if(!libres.length) return null;
    const s = libres[Math.floor(Math.random() * libres.length)];
    solos.add(s); return SOLOS[s];
  };
  for(const eq of EQUIPES){
    const adv = membres(adverse(eq));
    if(Math.random() < .5 && adv.length){
      const m = Math.floor(Math.random() * MODELES.length);
      const c = adv[Math.floor(Math.random() * adv.length)];
      if(paires.has(m + "|" + c.cle)) return null;
      if(modelesEquipe.has(m)) return null;
      paires.add(m + "|" + c.cle); modelesEquipe.add(m);
      missionsEquipe[eq] = remplir(MODELES[m], c.nom);
    } else {
      const s = soloLibre(); if(!s) return null;
      missionsEquipe[eq] = s;
    }
  }
  const sortie = [];
  for(const j of ordre){
    const perso = [];
    for(const m of melanger(MODELES.map((_, i) => i))){
      if(perso.length === N_CIBLEES) break;
      if(modelesEquipe.has(m)) continue;
      const c = melanger(joueurs.filter(x => x.cle !== j.cle)).find(x => !paires.has(m + "|" + x.cle));
      if(!c) continue;
      paires.add(m + "|" + c.cle);
      perso.push(remplir(MODELES[m], c.nom));
    }
    if(perso.length < N_CIBLEES) return null;
    for(let k = 0; k < N_SOLO; k++){ const s = soloLibre(); if(!s) return null; perso.push(s); }
    const liste = melanger(perso);
    const idx = Math.floor(Math.random() * (liste.length + 1));
    liste.splice(idx, 0, missionsEquipe[equipeDe[j.cle]]);
    sortie.push({ cle: j.cle, equipe: equipeDe[j.cle], espion: espions[equipeDe[j.cle]] === j.cle, missions: liste, idx_equipe: idx });
  }
  return { missions_equipe: missionsEquipe, joueurs: sortie };
}
function genererPartie(joueurs){
  for(let essai = 0; essai < 500; essai++){ const r = tenterPartie(joueurs); if(r) return r; }
  throw new Error("Impossible de répartir les missions : ajoutez des missions sans cible dans le fichier.");
}
function calculerScores(t){
  const sc = {}, par = {};
  EQUIPES.forEach(eq => { sc[eq] = { missions: 0, devinette: 0, coequipiers: 0, espion: 0, total: 0 }; });
  (t.joueurs || []).forEach(j => { par[j.cle] = j; });
  (t.joueurs || []).forEach(j => {
    if(!sc[j.equipe]) return;
    const s = sc[j.equipe];
    s.missions += j.reussies;
    if(j.mission_ok) s.devinette += 3;
    (j.coequipiers || []).forEach(k => {
      const o = par[k]; if(!o || !sc[o.equipe]) return;
      if(o.equipe === j.equipe) s.coequipiers += 1;
      else { s.coequipiers -= 1; if(o.espion) sc[o.equipe].espion += 2; }
    });
  });
  EQUIPES.forEach(eq => { const s = sc[eq]; s.total = s.missions + s.devinette + s.coequipiers + s.espion; });
  return sc;
}

let T = null, minuteurEcran = null, etape = 0, teaserIdx = 0;

function depuis(iso){
  const s = Math.max(0, (new Date(T.maintenant) - new Date(iso)) / 1000);
  if(s < 60) return "à l’instant";
  const m = Math.round(s / 60);
  return m < 60 ? `il y a ${m} min` : `il y a ${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}`;
}

async function tickEcran(){
  let t;
  try{ t = await rpc("jeu_tableau"); }
  catch(e){
    if(!T){ $("#ecran").innerHTML = `<p class="centre erreur" style="margin-top:30vh"></p>`; $("#ecran p").textContent = e.message; }
    return;
  }
  const ancien = T; T = t;
  if(t.phase === "resultats"){
    if(!ancien || ancien.phase !== "resultats"){ etape = 0; dessinerResultats(); }
    return;
  }
  dessinerTableau(ancien);
}

function dessinerTableau(ancien){
  const t = T;
  let etat = "";
  if(t.phase === "attente") etat = "La partie va bientôt commencer…";
  else if(t.phase === "missions") etat = t.nb_roue < t.nb_joueurs ? `Missions en cours · ${t.nb_roue} / ${t.nb_joueurs} joueurs ont tourné la roue` : "Missions en cours";
  else if(t.phase === "vote") etat = `Le vote est ouvert ! ${t.nb_votes} / ${t.nb_joueurs} ont voté`;
  if(Math.random() < .2) teaserIdx = (teaserIdx + 1) % TEASERS.length;

  const carteEq = eq => `<div class="equipe ${eq}" id="eq-${eq}">
      <div class="bob${eq === "Patate" ? "2" : ""}">${mascotte(eq, 0, 150)}</div>
      <h2>Équipe ${eq}</h2>
      <div class="score">${t.equipes[eq]}</div>
      <div style="font-size:1.3rem;opacity:.9">mission${t.equipes[eq] > 1 ? "s" : ""} réussie${t.equipes[eq] > 1 ? "s" : ""}</div>
    </div>`;
  const evts = (t.evenements || []).map(e =>
    `<li><span class="pastille" style="background:${e.equipe === "Dinde" ? "var(--dinde)" : "var(--patate)"}"></span>L’équipe ${esc(e.equipe)} marque un point <span style="color:var(--doux)">· ${depuis(e.quand)}</span></li>`).join("");

  $("#ecran").innerHTML = `
    <h1 class="ecran-titre">Dinde ou Patate ?</h1>
    <p class="etat">${etat}</p>
    <div class="equipes">${carteEq("Dinde")}${carteEq("Patate")}</div>
    <div class="carte fil"><h2>Dernières missions réussies</h2>
      ${evts ? `<ul>${evts}</ul>` : `<p class="sous" style="margin:0">Aucune pour l’instant. Qui ouvrira le score ?</p>`}</div>
    <p class="teaser">${esc(TEASERS[teaserIdx])}</p>`;

  if(ancien && ancien.phase === t.phase){
    EQUIPES.forEach(eq => {
      if(t.equipes[eq] > ancien.equipes[eq]){
        const el = $("#eq-" + eq); el.classList.add("flash");
        confettis(couleurs(eq), 120);
      }
    });
  }
}

const ETAPES = 6;
function etapeSuivante(){ if(etape < ETAPES - 1){ etape++; dessinerResultats(); } }

function dessinerResultats(){
  const t = T, sc = calculerScores(t), js = t.joueurs || [];
  const noms = eq => js.filter(j => j.equipe === eq);
  let c = "";
  if(etape === 0){
    c = `<div class="duo"><span class="bob">${mascotte("Dinde", 1, 170)}</span><span class="bob2">${mascotte("Patate", 1, 170)}</span></div>
         <h1>Place aux résultats !</h1>
         <p class="grande">Missions d’équipe, espions, équipes… tout va être révélé.</p>`;
  } else if(etape === 1){
    c = `<h1>Les missions d’équipe</h1><div class="equipes">${EQUIPES.map(eq => `
           <div class="equipe ${eq} pop"><h2>Équipe ${eq}</h2><p class="grande mission-eq" data-eq="${eq}"></p>
           <p style="font-size:1.2rem">${noms(eq).filter(j => j.mission_ok).length} / ${noms(eq).length} l’ont reconnue</p></div>`).join("")}</div>`;
  } else if(etape === 2){
    c = `<h1>Les espions étaient…</h1><div class="equipes">${EQUIPES.map(eq => {
           const e = noms(eq).find(j => j.espion);
           const dupes = js.filter(j => j.equipe !== eq && (j.coequipiers || []).includes(e && e.cle)).length;
           return `<div class="dossier pop" style="padding:28px"><span class="tampon">ESPION</span>
             <h2 style="font-size:2.4rem;margin:16px 0 6px">${esc(e ? e.nom : "Personne")}</h2>
             <p class="grande" style="margin:0">pour l’équipe ${eq}</p>
             <p style="font-size:1.2rem;opacity:.85">${dupes} adversaire${dupes > 1 ? "s" : ""} trompé${dupes > 1 ? "s" : ""}</p></div>`;
         }).join("")}</div>`;
  } else if(etape === 3){
    c = `<h1>Les équipes</h1><div class="equipes">${EQUIPES.map(eq => `
           <div class="equipe ${eq} pop"><div>${mascotte(eq, 2, 110)}</div><h2>Équipe ${eq}</h2>
           <p class="grande">${noms(eq).map(j => esc(j.nom) + (j.espion ? " 🕵️" : "")).join("<br>")}</p></div>`).join("")}</div>`;
  } else if(etape === 4){
    const ligne = (lib, k) => `<tr><td>${lib}</td>${EQUIPES.map(eq => `<td class="n">${sc[eq][k] > 0 && k !== "missions" ? "+" : ""}${sc[eq][k]}</td>`).join("")}</tr>`;
    c = `<h1>Le décompte</h1><div class="carte pop"><table>
           <tr><th></th>${EQUIPES.map(eq => `<th class="n" style="color:${eq === "Dinde" ? "var(--dinde)" : "var(--patate)"}">${eq}</th>`).join("")}</tr>
           ${ligne("Missions réussies", "missions")}
           ${ligne("Mission d’équipe reconnue (+3 chacun)", "devinette")}
           ${ligne("Coéquipiers identifiés (+1 / −1)", "coequipiers")}
           ${ligne("Adversaires trompés par l’espion (+2)", "espion")}
           <tr class="total"><td>Total</td>${EQUIPES.map(eq => `<td class="n">${sc[eq].total}</td>`).join("")}</tr>
         </table></div>`;
  } else {
    const [a, b] = EQUIPES, g = sc[a].total === sc[b].total ? null : (sc[a].total > sc[b].total ? a : b);
    c = g
      ? `<div class="pop bob">${mascotte(g, 2, 240)}</div><h1>L’équipe ${g} l’emporte !</h1>
         <p class="grande">${sc[g].total} points contre ${sc[adverse(g)].total}. Bravo à ${noms(g).map(j => esc(j.nom)).join(", ")} !</p>`
      : `<div class="duo"><span class="bob pop">${mascotte("Dinde", 2, 190)}</span><span class="bob2 pop">${mascotte("Patate", 2, 190)}</span></div>
         <h1>Égalité parfaite !</h1><p class="grande">${sc[a].total} points partout. La dinde et la patate partagent la tarte.</p>`;
  }
  $("#ecran").innerHTML = `<div class="revel">${c}
    ${etape < ETAPES - 1 ? `<p style="margin-top:30px"><button id="suivant" class="Dinde" style="font-size:1.3rem;padding:16px 30px">Révéler la suite</button></p>
    <p class="sous">ou appuyez sur la barre d’espace</p>` : ""}</div>`;
  document.querySelectorAll(".mission-eq").forEach(el => { el.textContent = fr((t.missions_equipe || {})[el.dataset.eq]); });
  const s = $("#suivant"); if(s) s.onclick = etapeSuivante;
  if(etape === ETAPES - 1) setTimeout(() => confettis(undefined, 320), 200);
}

/* =====================================================================
   COULISSES DE L'ORGANISATRICE (#admin)
   ===================================================================== */
let codeAdmin = stock("dp-admin"), minuteurAdmin = null;
const LIBELLES = { attente: "En attente de distribution", missions: "Missions en cours", vote: "Vote ouvert", resultats: "Résultats affichés" };

async function demarrerAdmin(){
  if(!codeAdmin) return ecranAdminConnexion();
  try{ ecranAdmin(await rpc("jeu_admin_etat", { p_admin: codeAdmin })); }
  catch(e){ stock("dp-admin", null); codeAdmin = null; return ecranAdminConnexion(e.message); }
  clearInterval(minuteurAdmin);
  minuteurAdmin = setInterval(async () => {
    if(modalOuvert()) return;
    try{ ecranAdmin(await rpc("jeu_admin_etat", { p_admin: codeAdmin })); }catch(e){}
  }, 8000);
}

function ecranAdminConnexion(err){
  h(`<h1>Coulisses</h1><p class="sous">Espace réservé à l’organisatrice.</p>
     <div class="carte"><label for="ca">Code organisatrice</label><input id="ca" type="password" autocomplete="off">
     <p style="margin:14px 0 0"><button id="go">Entrer</button></p><p class="erreur" id="err"></p></div>
     <p><a href="#">Page des joueurs</a> · <a href="#ecran">Écran de projection</a></p>`);
  $("#err").textContent = err || "";
  const go = () => { const v = $("#ca").value.trim(); if(!v) return; codeAdmin = v; stock("dp-admin", v); demarrerAdmin(); };
  $("#go").onclick = go;
  $("#ca").onkeydown = e => { if(e.key === "Enter") go(); };
}

function ecranAdmin(e){
  const roue = e.joueurs.filter(j => j.roue).length, votes = e.joueurs.filter(j => j.a_vote).length;
  const actions = {
    attente:   [["distribuer", "Distribuer les cartes", "Dinde"]],
    missions:  [["vote", "Ouvrir le vote", "Dinde"], ["redistribuer", "Redistribuer les cartes", "danger"]],
    vote:      [["resultats", "Afficher les résultats", "Dinde"], ["missions", "Rouvrir les missions", "fantome"]],
    resultats: [["vote", "Revenir au vote", "fantome"], ["reinit", "Préparer une nouvelle partie", "danger"]]
  }[e.phase] || [];
  if(e.phase !== "attente" && e.phase !== "resultats") actions.push(["reinit", "Tout réinitialiser", "danger"]);
  h(`<h1>Coulisses</h1>
     <p class="sous">Aucune information secrète n’est affichée ici : vous pouvez jouer sans risque.</p>
     <div class="carte"><h2>${LIBELLES[e.phase] || e.phase}</h2>
       <p style="margin:0">${roue} / ${e.joueurs.length} joueurs ont tourné la roue · ${votes} / ${e.joueurs.length} ont voté</p></div>
     <div class="carte"><h2>Actions</h2><div class="boutons" style="justify-content:flex-start" id="actions"></div><p class="erreur" id="err"></p></div>
     <div class="carte"><h2>Joueurs</h2><table class="admin-table">
       <tr><th>Prénom</th><th class="n">Roue</th><th class="n">Vote</th></tr>
       ${e.joueurs.map(j => `<tr><td>${esc(j.nom)}</td><td class="n">${j.roue ? "✓" : "·"}</td><td class="n">${j.a_vote ? "✓" : "·"}</td></tr>`).join("")}
     </table></div>
     <p><a href="#ecran">Ouvrir l’écran de projection</a> · <a href="#">Page des joueurs</a> · <a href="#" id="deco">Se déconnecter</a></p>`);
  $("#deco").onclick = ev => { ev.preventDefault(); stock("dp-admin", null); codeAdmin = null; clearInterval(minuteurAdmin); ecranAdminConnexion(); };
  const zone = $("#actions");
  actions.forEach(([id, lib, cls]) => {
    const b = document.createElement("button");
    b.className = cls; b.textContent = lib;
    b.onclick = () => action(id, e);
    zone.appendChild(b);
  });
}

async function action(id, e){
  const conf = {
    distribuer: "Je distribue les cartes ? Les invités pourront tourner la roue juste après.",
    redistribuer: "Redistribuer efface les équipes, les missions cochées et les votes. On recommence vraiment ?",
    vote: "J’ouvre le vote ? Les invités ne pourront plus cocher de missions.",
    missions: "Je rouvre les missions ? Les votes déjà faits sont conservés.",
    resultats: "J’affiche les résultats ? Tout sera révélé sur l’écran de projection.",
    reinit: "Tout réinitialiser ? La partie repart de zéro, en attente de distribution."
  }[id];
  const ok = await demander({ equipe: "Dinde", humeur: 1, texte: conf, oui: "Oui, allons-y", non: "Annuler" });
  if(!ok) return;
  try{
    if(id === "distribuer" || id === "redistribuer"){
      const p = genererPartie(e.joueurs.map(j => ({ cle: j.cle, nom: j.nom })));
      await rpc("jeu_admin_distribuer", { p_admin: codeAdmin, p_donnees: p });
      confettis();
    } else if(id === "reinit"){
      await rpc("jeu_admin_reinitialiser", { p_admin: codeAdmin });
    } else {
      await rpc("jeu_admin_phase", { p_admin: codeAdmin, p_phase: id });
    }
    ecranAdmin(await rpc("jeu_admin_etat", { p_admin: codeAdmin }));
  }catch(err){ const z = $("#err"); if(z) z.textContent = err.message; }
}

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
function router(){
  clearInterval(minuteur); clearInterval(minuteurEcran); clearInterval(minuteurAdmin);
  document.onkeydown = null; app.classList.remove("large");
  if(location.hash === "#ecran") return demarrerEcran();
  if(location.hash === "#admin") return demarrerAdmin();
  demarrerJoueur();
}
window.addEventListener("hashchange", router);

if(CONFIG.SUPABASE_URL.includes("VOTRE-PROJET")){
  h(`<div class="carte" style="margin-top:10vh"><h1>Configuration manquante</h1>
     <p>Ouvrez ce fichier dans un éditeur de texte et renseignez <strong>SUPABASE_URL</strong> et <strong>SUPABASE_CLE</strong>, tout en haut de la partie script.</p></div>`);
} else {
  router();
}
</script>
